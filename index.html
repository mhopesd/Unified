<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified — Open World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    canvas { display: block; image-rendering: pixelated; }
    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      pointer-events: none;
      z-index: 10;
    }
    #hud {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #mission-tracker {
      position: fixed;
      top: 50px; right: 16px;
      color: #ffd700;
      font-size: 13px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
      max-width: 250px;
    }
    #marketplace-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 360px;
      background: rgba(20, 20, 30, 0.95);
      border-left: 2px solid #333;
      color: #eee;
      z-index: 20;
      display: none;
      overflow-y: auto;
      pointer-events: all;
    }
    #marketplace-panel.open { display: block; }
    #marketplace-panel h2 { padding: 16px; border-bottom: 1px solid #333; }
    .mp-mission {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .mp-mission:hover { background: rgba(255,255,255,0.05); }
    .mp-mission h3 { font-size: 14px; color: #ffd700; }
    .mp-mission p { font-size: 12px; color: #aaa; margin-top: 4px; }
    .mp-mission button {
      margin-top: 8px;
      padding: 4px 12px;
      background: #ffd700;
      color: #111;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      pointer-events: all;
    }
    #controls-hint {
      position: fixed;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div id="hud">
      <span id="hud-pos">X: 0  Y: 0</span>
      <span id="hud-fps">FPS: 0</span>
    </div>
  </div>
  <div id="mission-tracker"></div>
  <div id="marketplace-panel">
    <h2>Marketplace</h2>
    <div id="mp-list"></div>
  </div>
  <div id="controls-hint">WASD move · E interact · M marketplace · ESC close</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
